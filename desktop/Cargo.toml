[workspace]
resolver = "2"
members = ["core", "app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The DSP loops are far too slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.mr-core]
opt-level = 3
